name: Validate dataset

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install QA dependency
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Check Python formatting and lint
        run: |
          ruff format --check scripts tests
          ruff check scripts tests
      - name: Validate checked-in artifacts and report freshness
        run: |
          tmp_reports="$(mktemp -d)"
          cp reports/validation.json "$tmp_reports/validation.json"
          cp reports/QA_REPORT.md "$tmp_reports/QA_REPORT.md"
          python scripts/validate_dataset.py --root .
          cmp "$tmp_reports/validation.json" reports/validation.json
          cmp "$tmp_reports/QA_REPORT.md" reports/QA_REPORT.md
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Reproduce release artifacts
        run: |
          tmp_dir="$(mktemp -d)"
          python scripts/generate_dataset.py --output-root "$tmp_dir" --formats jsonl parquet
          for file in \
            data/all.jsonl \
            data/train.jsonl \
            data/validation.jsonl \
            data/test.jsonl \
            data/train.parquet \
            data/validation.parquet \
            data/test.parquet \
            samples/topic-split-samples.jsonl \
            samples/topic-turn-samples.jsonl \
            MANIFEST.json \
            SHA256SUMS; do
            cmp "$file" "$tmp_dir/$file"
          done
